<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="magenNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2D64" />
      <stop offset="100%" stop-color="#081E44" />
    </linearGradient>
    <linearGradient id="magenGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background container optional or transparent -->
  <rect width="600" height="600" fill="transparent" />

  <g transform="translate(0, 10)">
    <!-- Small Printer Icon above left of I -->
    <g transform="translate(245, 110) scale(0.9)">
      <!-- Printer top paper -->
      <path d="M 12 0 L 32 0 C 34 0 36 2 36 4 L 36 12 L 8 12 L 8 4 C 8 2 10 0 12 0 Z" fill="#0C2D64" />
      <!-- Printer main body -->
      <rect x="2" y="12" width="40" height="20" rx="4" fill="#0C2D64" />
      <!-- Paper output slit -->
      <rect x="8" y="24" width="28" height="12" rx="2" fill="#FFFFFF" />
      <!-- Paper lines inside output -->
      <line x1="12" y1="28" x2="32" y2="28" stroke="#0C2D64" stroke-width="2" stroke-linecap="round" />
      <line x1="12" y1="32" x2="28" y2="32" stroke="#0C2D64" stroke-width="2" stroke-linecap="round" />
      <!-- Status dot -->
      <circle cx="36" cy="18" r="1.5" fill="#4CAF50" />
    </g>

    <!-- Green Leaf Icon above I -->
    <g transform="translate(315, 95) scale(0.95)">
      <path d="M 0 55 C 5 25 25 5 50 0 C 48 30 35 52 10 56 Z" fill="url(#magenGreenGrad)" />
      <!-- Leaf center vein -->
      <path d="M 8 50 Q 22 30 45 4" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.6" />
    </g>

    <!-- MIS Monogram -->
    <!-- 'M' in Navy Blue -->
    <path d="M 115 350 L 115 200 C 115 175 135 155 160 155 C 180 155 198 168 205 188 L 245 285 L 285 188 C 292 168 310 155 330 155 C 335 155 338 156 342 158 C 336 172 333 186 333 202 L 333 260 C 315 240 290 220 270 245 L 245 295 L 200 190 C 195 180 185 178 175 178 C 160 178 145 190 145 210 L 145 350 Z" fill="url(#magenNavyGrad)" />
    
    <!-- Robust vector M -->
    <path d="M 110 350 L 110 205 C 110 170 140 155 165 155 C 188 155 206 170 216 190 L 255 275 L 294 190 C 304 170 322 155 345 155 C 370 155 385 170 385 195 L 385 225 L 345 225 L 345 205 C 345 195 338 188 330 188 C 322 188 315 195 310 205 L 270 295 C 265 305 245 305 240 295 L 200 205 C 195 195 188 188 180 188 C 172 188 165 195 165 205 L 165 350 Z" fill="url(#magenNavyGrad)" />

    <!-- 'I' in Leaf Green with bottom sweep -->
    <path d="M 285 175 L 325 175 L 325 320 C 325 335 335 345 350 345 L 420 345 C 440 345 455 340 470 330 L 470 360 C 455 375 435 385 410 385 L 340 385 C 310 385 285 360 285 330 Z" fill="url(#magenGreenGrad)" />

    <!-- 'S' in Navy Blue -->
    <path d="M 345 175 C 390 170 480 175 480 235 C 480 270 450 285 400 295 C 360 302 345 310 345 325 C 345 338 355 348 375 348 L 475 348 L 475 385 L 375 385 C 330 385 305 360 305 325 C 305 290 335 272 385 262 C 430 252 440 245 440 232 C 440 218 425 210 395 210 C 365 210 345 220 335 230 L 335 185 C 338 180 341 177 345 175 Z" fill="url(#magenNavyGrad)" />

    <!-- Separator Line with MAGEN -->
    <g transform="translate(60, 440)">
      <!-- Left line -->
      <line x1="5" y1="2" x2="80" y2="2" stroke="#0C2D64" stroke-width="4" stroke-linecap="round" />
      
      <!-- MAGEN Text -->
      <text x="240" y="16" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="12" fill="#0C2D64" text-anchor="middle">MAGEN</text>
      
      <!-- Right line -->
      <line x1="400" y1="2" x2="475" y2="2" stroke="#0C2D64" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- INTEGRATED SOLUTIONS -->
    <text x="300" y="495" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="7" fill="#0C2D64" text-anchor="middle">INTEGRATED SOLUTIONS</text>

    <!-- MEDIA & PRINT SOLUTIONS | ENVIRONMENTAL CONSULTANCY -->
    <g transform="translate(300, 530)">
      <text x="0" y="0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5" text-anchor="middle">
        <tspan fill="#0C2D64">MEDIA &amp; PRINT SOLUTIONS</tspan>
        <tspan fill="#4CAF50" font-weight="900"> | </tspan>
        <tspan fill="#2E7D32">ENVIRONMENTAL CONSULTANCY</tspan>
      </text>
    </g>
  </g>
</svg>
